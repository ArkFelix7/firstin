<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FirstIn iMessage recreation</title>
<style>
  @font-face {
    font-family: "InterLocal";
    src: url("file:///Users/aarya/dev_all/reel-maker/packages/render/public/fonts/Inter-Variable.ttf");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: -apple-system, "SF Pro Text", "InterLocal", Inter, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---------- phone frame ---------- */
  .phone {
    width: 414px; height: 868px; padding: 12px;
    border-radius: 66px;
    background: #1c1c1e;
    box-shadow: inset 0 0 0 1.5px #3a3a3c, inset 0 0 0 4px #111;
    position: relative;
  }
  .screen {
    width: 390px; height: 844px; border-radius: 54px; overflow: hidden;
    background: #fff; position: relative; display: flex; flex-direction: column;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 5;
  }

  /* ---------- status bar ---------- */
  .status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 30px 0 46px; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; color: #000; }
  .status .icons { display: flex; gap: 6px; align-items: center; }

  /* ---------- nav ---------- */
  .nav { flex: none; height: 92px; position: relative; border-bottom: 0.5px solid #d1d1d6; background: #f9f9f9; }
  .nav .back { position: absolute; left: 10px; top: 14px; display: flex; align-items: center; }
  .nav .center { position: absolute; left: 0; right: 0; top: 4px; display: flex; flex-direction: column; align-items: center; }
  .avatar { width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(180deg, #a5abb8 0%, #858994 100%);
    color: #fff; font-size: 21px; font-weight: 500; display: flex; align-items: center; justify-content: center; letter-spacing: 0.3px; }
  .name { margin-top: 5px; font-size: 12px; color: #000; display: flex; align-items: center; gap: 3px; }
  .name svg { margin-top: 1px; }

  /* ---------- transcript ---------- */
  .thread { flex: 1; overflow: hidden; padding: 10px 0 8px; display: flex; flex-direction: column; justify-content: flex-end; }
  .sep { text-align: center; font-size: 11px; color: #8a8a8e; line-height: 14px; margin: 4px 0 12px; }
  .sep b { font-weight: 600; }
  .row { display: flex; padding: 0 16px; }
  .row.in { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }
  .bubble {
    max-width: 268px; padding: 7px 13px 8px; border-radius: 18px; position: relative;
    font-size: 17px; line-height: 22px; letter-spacing: -0.25px; white-space: pre-wrap; overflow-wrap: break-word;
  }
  .in .bubble { background: #E9E9EB; color: #000; }
  .out .bubble { background: #0A84FF; color: #fff; }
  .bubble a { color: inherit; text-decoration: underline; }
  .bubble .elide { color: #6b6b70; }
  .gap-group { height: 12px; }
  .gap-same { height: 2px; }
  /* tails */
  .tail.in .bubble::before, .tail.out .bubble::before { content: ""; position: absolute; bottom: 0; height: 20px; width: 20px; }
  .tail.in .bubble::after, .tail.out .bubble::after { content: ""; position: absolute; bottom: 0; height: 20px; width: 10px; background: #fff; }
  .tail.in .bubble::before { left: -7px; background: #E9E9EB; border-bottom-right-radius: 16px 14px; }
  .tail.in .bubble::after { left: -10px; border-bottom-right-radius: 10px; }
  .tail.out .bubble::before { right: -7px; background: #0A84FF; border-bottom-left-radius: 16px 14px; }
  .tail.out .bubble::after { right: -10px; border-bottom-left-radius: 10px; }
  .receipt { text-align: right; font-size: 11px; color: #8a8a8e; padding: 3px 18px 0; font-weight: 500; }

  /* ---------- input bar ---------- */
  .inputbar { flex: none; height: 88px; padding: 6px 12px 0; display: flex; align-items: flex-start; gap: 9px; background: #fff; position: relative; }
  .plus { width: 34px; height: 34px; border-radius: 50%; background: #E9E9EB; display: flex; align-items: center; justify-content: center; flex: none; }
  .field { flex: 1; height: 36px; border: 1px solid #c7c7cc; border-radius: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 14px; color: #b0b0b5; font-size: 17px; letter-spacing: -0.3px; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #000; }

  /* ---------- combined slide ---------- */
  .slide { width: 1920px; height: 1080px; background: #F7F5F0; position: relative; font-family: "InterLocal", Inter, sans-serif; }
  .slide .pair { position: absolute; top: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 200px; }
  .slide .col { display: flex; flex-direction: column; align-items: center; }
  .slide .phone { box-shadow: inset 0 0 0 1.5px #3a3a3c, inset 0 0 0 4px #111, 0 30px 60px -20px rgba(40,30,10,0.28), 0 8px 18px -8px rgba(40,30,10,0.18); }
  .slide .cap { margin-top: 26px; font-size: 30px; font-weight: 600; color: #1d1f23; letter-spacing: -0.4px; }
  .slide .card { width: 470px; height: 810px; border-radius: 44px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 10px #1c1c1e, 0 0 0 11.5px #3a3a3c, 0 34px 64px -18px rgba(40,30,10,0.32), 0 8px 18px -8px rgba(40,30,10,0.18); margin-top: 12px; }
  .slide .card img { width: 100%; display: block; }
  .slide.real .pair { top: 52px; gap: 240px; }
  .slide.real .cap { margin-top: 40px; }
  .slide .foot { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 17px; color: #7a766d; letter-spacing: -0.1px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SVG_SIGNAL = '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>';
const SVG_WIFI = '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.4 1.5 10.8.5 8 .5S2.6 1.5.6 3.5l1.2 1.2C3.4 3.1 5.6 2.2 8 2.2zm0 3.4c1.5 0 2.8.6 3.8 1.5L13 5.9C11.7 4.6 9.9 3.9 8 3.9s-3.7.7-5 2l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.3c-.7 0-1.3.3-1.8.7L8 11.4l1.8-1.8c-.5-.4-1.1-.7-1.8-.7z"/></svg>';
const SVG_BATT = '<svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill-opacity=".4"/></svg>';
const SVG_BACK = '<svg width="13" height="22" viewBox="0 0 13 22"><path d="M11 2 2 11l9 9" fill="none" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_SMALLCHEV = '<svg width="6" height="10" viewBox="0 0 6 10"><path d="M1 1l4 4-4 4" fill="none" stroke="#8a8a8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_PLUS = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1v14M1 8h14" stroke="#7c7c80" stroke-width="2.2" stroke-linecap="round"/></svg>';
const SVG_MIC = '<svg width="14" height="20" viewBox="0 0 14 20"><rect x="4" y="1" width="6" height="11" rx="3" fill="#8a8a8e"/><path d="M1.5 9.5a5.5 5.5 0 0 0 11 0M7 15v3.5" fill="none" stroke="#8a8a8e" stroke-width="1.6" stroke-linecap="round"/></svg>';

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Display in Pacific Standard Time (UTC-8; Nov 14 is after DST ends).
function pst(ts) { return new Date(new Date(ts).getTime() - 8 * 3600 * 1000); }
function clock(d) { let h = d.getUTCHours() % 12 || 12; return `${h}:${String(d.getUTCMinutes()).padStart(2,"0")}`; }
function ampm(d) { return d.getUTCHours() < 12 ? "AM" : "PM"; }
function sepText(d) { return `<b>${DAYS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}</b> at ${clock(d)} ${ampm(d)}`; }

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a>$1</a>'); }

// msg: {text, from, ts, elide?: [startLine, endLine)} -- elide replaces whole lines with "…"
function bubbleHTML(m) {
  let text = m.text;
  if (m.keepLines) {
    const lines = text.split("\n");
    return m.keepLines.map(k => k === "…" ? '<span class="elide">…</span>' : linkify(lines[k])).join("\n");
  }
  return linkify(text);
}

function phone(msgs, opts = {}) {
  const first = pst(msgs[0].ts), last = pst(msgs[msgs.length - 1].ts);
  let lastOut = -1; msgs.forEach((m, i) => { if (m.from === "officer") lastOut = i; });
  let body = `<div class="sep">iMessage<br>${sepText(first)}</div>`;
  msgs.forEach((m, i) => {
    const dir = m.from === "officer" ? "out" : "in";
    const next = msgs[i + 1];
    const tail = !next || next.from !== m.from;
    if (i > 0) body += `<div class="${msgs[i-1].from === m.from ? "gap-same" : "gap-group"}"></div>`;
    body += `<div class="row ${dir}${tail ? " tail" : ""}"><div class="bubble">${bubbleHTML(m)}</div></div>`;
    if (i === lastOut) body += `<div class="receipt">Delivered</div>`;
  });
  const statusClock = clock(new Date(last.getTime() + 20000));
  return `
  <div class="phone"><div class="screen">
    <div class="island"></div>
    <div class="status"><span>${statusClock}</span><span class="icons">${SVG_SIGNAL}${SVG_WIFI}${SVG_BATT}</span></div>
    <div class="nav">
      <div class="back">${SVG_BACK}</div>
      <div class="center"><div class="avatar">FI</div><div class="name">FirstIn ${SVG_SMALLCHEV}</div></div>
    </div>
    <div class="thread">${body}</div>
    <div class="inputbar">
      <div class="plus">${SVG_PLUS}</div>
      <div class="field"><span>iMessage</span>${SVG_MIC}</div>
      <div class="home"></div>
    </div>
  </div></div>`;
}

function build() {
  const T = window.TRANSCRIPT.messages.map(m => ({...m}));
  const E = window.ELIDE || {};               // index -> keepLines array
  for (const k in E) T[k].keepLines = E[k];
  const approve = T.slice(0, 4), standpipe = T.slice(4, 7);
  const view = new URLSearchParams(location.search).get("view") || "approve";
  const root = document.getElementById("root");
  if (view === "approve") root.innerHTML = phone(approve);
  else if (view === "standpipe") root.innerHTML = phone(standpipe);
  else if (view === "combined-real") root.innerHTML = `<div class="slide real">
      <div class="pair">
        <div class="col"><div class="card"><img src="real-approval-request.png"></div><div class="cap">Approval request on the officer's iPhone</div></div>
        <div class="col"><div class="card"><img src="real-exit-question.png"></div><div class="cap">A question answered from the plan</div></div>
      </div>
      <div class="foot">Real screenshots, iMessage via Photon, Nov 15, 2026.</div>
    </div>`;
  else root.innerHTML = `<div class="slide">
      <div class="pair">
        <div class="col">${phone(approve)}<div class="cap">Officer approves from an iPhone</div></div>
        <div class="col">${phone(standpipe)}<div class="cap">Ask a question, get an answer from the plan</div></div>
      </div>
      <div class="foot">Recreated from the Photon message log. Real messages, Nov 14, 2026.</div>
    </div>`;
  // overflow report: does the thread content exceed its box?
  window.OVERFLOW = [...document.querySelectorAll(".thread")].map(t => Math.round(t.getBoundingClientRect().top + 10 - t.firstElementChild.getBoundingClientRect().top));
}
window.build = build;
</script>
</body>
</html>
